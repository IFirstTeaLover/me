<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSprout</title>
    <link rel="stylesheet" href="./style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <button class="theme-toggle" type="button" aria-label="Switch to dark theme">
        <img src="./icons/sun.svg" alt="">
    </button>

    <div class="scroller">
        <div class="avatar"><img src="./avatar.svg" alt="Avatar"></div>
    </div>

    <div class="announcements">
        <div class="announcement" role="button" tabindex="0" aria-expanded="false">
            <img src="./icons/logos/Discord-Symbol-Black.svg" alt="Discord">
            <div class="text-content">
                <h3>Join my Discord server</h3>
                <h5>For fun</h5>
            </div>
        </div>
    </div>

    <h5 class="version">v1.0</h5>

    <script src="./script.js"></script>
    <script src="./theme.js"></script>
</body>

</html>
